apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnap-server
  namespace: cnap-dev-temp
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: cnap-server
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: cnap-server-secret
                  key: db-url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cnap-server-secret
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cnap-server-secret
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cnap-server-secret
                  key: jwt-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
