apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cnap-dev

bases:
  - ../../base

patchesStrategicMerge:
  - deployment-patch.yaml

images:
  - name: cnap-server
    newName: cnap-registry:5001/cnap-server  # k3d local registry (macOS: 5001, Linux: 5000)
    newTag: dev

commonLabels:
  environment: local
