apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnap-server
  namespace: cnap-dev
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: cnap-server
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "local"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
