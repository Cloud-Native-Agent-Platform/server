apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnap-server
  namespace: cnap-dev
  labels:
    app.kubernetes.io/name: cnap-server
    app.kubernetes.io/component: server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnap-server-role
  namespace: cnap-dev
rules:
  - apiGroups: ["cnap.io"]
    resources: ["agents", "agentjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["cnap.io"]
    resources: ["agents/status", "agentjobs/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnap-server-rolebinding
  namespace: cnap-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cnap-server-role
subjects:
  - kind: ServiceAccount
    name: cnap-server
    namespace: cnap-dev
