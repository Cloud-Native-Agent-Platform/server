spring:
  application:
    name: cnap-server-local

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

cnap:
  kubernetes:
    namespace: ${CNAP_K8S_NAMESPACE:cnap-dev}
  stream:
    mode: ${CNAP_STREAM_MODE:sse}
  auth:
    token: ${CNAP_AUTH_TOKEN:local-dev-token}
  cors:
    allowed-origins:
      - "*"
    allowed-headers:
      - "*"
    allow-credentials: false
    max-age: 3600

logging:
  level:
    root: DEBUG
    com.cnap: TRACE
