spring:
  application:
    name: cnap-server-local

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

cnap:
  kubernetes:
    namespace: cnap-dev
  stream:
    mode: sse
  auth:
    token: local-dev-token
  jwt:
    secret: ThisIsAVeryLongSecretKeyForJWTTokenGenerationAndValidationMinimum256BitsRequired
    access-token-expiration: 1800000
    refresh-token-expiration: 2592000000
  cors:
    allowed-origins:
      - "*"
    allowed-headers:
      - "*"
    allow-credentials: false
    max-age: 3600

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: DEBUG
    com.cnap: TRACE
