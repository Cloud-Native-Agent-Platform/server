name: CI/CD - Build, Push and Deploy to k3s (Dev)

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'Dockerfile'
      - '.github/workflows/ci-cd-dev.yml'
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew clean build --build-cache --parallel --daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          DOCKER_REPOSITORY="${DOCKERHUB_USERNAME}/${PROJECT_NAME}"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --provenance=false \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t $DOCKER_REPOSITORY:$IMAGE_TAG \
            -t $DOCKER_REPOSITORY:latest \
            .

      - name: Deploy to k3s
        env:
          SERVER_PEM: ${{ secrets.SERVER_PEM }}
          HOST_URL: ${{ vars.HOST_URL }}
          SSH_PORT: ${{ vars.SSH_PORT }}

          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          IMAGE_TAG: ${{ github.sha }}

          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p $SSH_PORT -H $HOST_URL >> ~/.ssh/known_hosts
          echo "$SERVER_PEM" > server.pem
          chmod 600 server.pem

          DOCKER_REPOSITORY="${DOCKERHUB_USERNAME}/${PROJECT_NAME}"

          # Copy k8s manifests to server
          scp -P $SSH_PORT -i server.pem -r k8s ubuntu@$HOST_URL:/tmp/

          # Apply Kubernetes resources
          ssh -p $SSH_PORT -i server.pem ubuntu@$HOST_URL << 'EOF'
            # Set environment variables for kustomization
            export IMAGE_REPOSITORY="${DOCKER_REPOSITORY}"
            export IMAGE_TAG="${IMAGE_TAG}"
            export K8S_NAMESPACE="${K8S_NAMESPACE}"
            export DB_URL="${DB_URL}"
            export DB_USERNAME="${DB_USERNAME}"
            export DB_PASSWORD="${DB_PASSWORD}"
            export JWT_SECRET="${JWT_SECRET}"

            # Apply kustomization
            kubectl apply -k /tmp/k8s/overlays/dev

            # Wait for deployment to complete
            kubectl rollout status deployment/cnap-server -n ${K8S_NAMESPACE} --timeout=5m

            # Cleanup
            rm -rf /tmp/k8s
          EOF
