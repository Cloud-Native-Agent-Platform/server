name: Deploy to k3s

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        default: 'latest'

jobs:
  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update image tag in kustomization
        run: |
          cd k8s/overlays/${{ github.event.inputs.environment }}
          kustomize edit set image cnap-server=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}

      - name: Deploy to k3s
        run: |
          kubectl apply -k k8s/overlays/${{ github.event.inputs.environment }}
          kubectl rollout status deployment/cnap-server -n cnap-dev --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get pods -n cnap-dev -l app.kubernetes.io/name=cnap-server
          kubectl get svc -n cnap-dev cnap-server
